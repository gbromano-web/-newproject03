<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasmat Ward — Admin Panel</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A5C3A'/%3E%3Ctext x='32' y='46' font-size='36' text-anchor='middle' font-family='serif'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --forest:#2A5C3A;--forest-d:#1f4429;--gold:#C8962A;
  --rose:#C85A5A;--ink:#1A1A1A;--muted:#6B7280;
  --bg:#F9FAFB;--surface:#FFFFFF;--border:#E5E7EB;
  --r:10px;--sh:0 2px 8px rgba(0,0,0,.08);
  --fn:Inter,system-ui,sans-serif;--fc:'Cinzel',serif;
}
body{font-family:var(--fn);background:var(--bg);color:var(--ink);min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{background:var(--surface);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:48px 40px;width:100%;max-width:400px;text-align:center}
.login-logo{font-family:var(--fc);font-size:20px;color:var(--forest);margin-bottom:8px}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:32px}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:var(--fn);transition:border-color .15s;outline:none}
.field input:focus{border-color:var(--forest)}
.btn-login{width:100%;padding:12px;background:var(--forest);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:8px}
.btn-login:hover{background:var(--forest-d)}
.login-error{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;color:#DC2626;font-size:13px;margin-top:12px;display:none}
.login-error.show{display:block}
#app{display:none}
.topbar{background:var(--forest);color:#fff;height:56px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:var(--fc);font-size:16px;font-weight:600;letter-spacing:.06em;flex:1}
.topbar-user{font-size:13px;opacity:.8}
.btn-tb{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .15s}
.btn-tb:hover{background:rgba(255,255,255,.25)}
.main{max-width:1200px;margin:0 auto;padding:24px 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--sh);text-align:center}
.stat-num{font-size:32px;font-weight:700;color:var(--forest)}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.controls h2{font-size:18px;font-weight:600;flex:1}
.btn{padding:8px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--forest);color:#fff}
.btn-primary:hover{background:var(--forest-d)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{opacity:.9}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink)}
.btn-outline:hover{border-color:var(--muted)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA}
.btn-danger:hover{background:#FECACA}
.table-wrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{background:#F3F4F6;padding:12px 16px;text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tbody tr{border-top:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:#F9FAFB}
td{padding:12px 16px;font-size:14px;vertical-align:middle}
.pname{font-weight:600;font-size:15px}
.psub{color:var(--muted);font-size:12px;margin-top:2px}
.ecol{font-size:24px;width:48px}
.bp{display:inline-block;padding:2px 10px;border-radius:50px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bf{background:#DCFCE7;color:#166534}
.bg{background:#FEF9C3;color:#854D0E}
.br{background:#FCE7F3;color:#9D174D}
.cat{background:#F3F4F6;color:var(--muted);padding:2px 10px;border-radius:50px;font-size:12px}
.toggle{position:relative;display:inline-block;width:40px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#D1D5DB;border-radius:50px;transition:.2s}
.slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--forest)}
.toggle input:checked+.slider::before{transform:translateX(18px)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-backdrop.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);transform:translateY(12px);transition:transform .2s}
.modal-backdrop.open .modal{transform:none}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.mtitle{font-size:17px;font-weight:700}
.xbtn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.mbody{padding:20px 24px 24px;display:grid;gap:14px}
.mf label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:5px}
.mf input,.mf select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--fn);outline:none}
.mf input:focus,.mf select:focus{border-color:var(--forest)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mck{display:flex;align-items:center;gap:10px;font-size:14px}
.mft{display:flex;gap:10px;justify-content:flex-end;padding:0 24px 24px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px}
.tabbtn{padding:10px 20px;font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tabbtn.active{color:var(--forest);border-bottom-color:var(--forest)}
.arow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px;align-items:flex-start}
.aact{font-weight:600;padding:2px 8px;border-radius:4px;background:#F3F4F6;color:var(--ink);white-space:nowrap;font-size:11px}
.atime{color:var(--muted);white-space:nowrap;min-width:130px}
.adet{flex:1;color:var(--muted)}
.toast{position:fixed;bottom:24px;right:24px;background:#1F2937;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:300;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--forest)}
.toast.error{background:#B91C1C}
.ox{overflow-x:auto}
@media(max-width:640px){.mrow{grid-template-columns:1fr}.topbar{padding:0 14px}.main{padding:16px 12px}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🌸 Nasmat Ward Gifts</div>
    <div class="login-sub">Product Management — Admin Portal</div>
    <div class="field"><label>Username</label><input type="text" id="lu" autocomplete="username" placeholder="nasmat"></div>
    <div class="field"><label>Password</label><input type="password" id="lp" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn-login" id="lbtn">Sign in</button>
    <div class="login-error" id="lerr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <span class="topbar-logo">🌸 Nasmat Ward — Admin</span>
    <span class="topbar-user" id="tu"></span>
    <button class="btn-tb" onclick="window.open('/','_blank')">View Site ↗</button>
    <button class="btn-tb" onclick="doLogout()">Sign out</button>
  </div>
  <div class="main">
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="s0">—</div><div class="stat-label">Total Products</div></div>
      <div class="stat-card"><div class="stat-num" id="s1">—</div><div class="stat-label">Fresh &amp; Available</div></div>
      <div class="stat-card"><div class="stat-num" id="s2">—</div><div class="stat-label">Hidden / Sold Out</div></div>
      <div class="stat-card"><div class="stat-num" id="s3">—</div><div class="stat-label">Active Categories</div></div>
    </div>
    <div class="tabs">
      <button class="tabbtn active" onclick="switchTab('products',this)">Products</button>
      <button class="tabbtn" onclick="switchTab('audit',this)">Audit Log</button>
    </div>
    <div id="tab-products">
      <div class="controls">
        <h2>Products</h2>
        <button class="btn btn-gold" onclick="markAllFresh()">✅ Mark All Fresh</button>
        <button class="btn btn-outline" onclick="exportJSON()">⬇ Export JSON</button>
        <button class="btn btn-primary" onclick="openModal()">+ Add Product</button>
      </div>
      <div class="ox"><div class="table-wrap">
        <table>
          <thead><tr><th style="width:56px"></th><th>Product</th><th>Category</th><th>Price</th><th>Badge</th><th>Fresh</th><th>Visible</th><th style="width:110px">Actions</th></tr></thead>
          <tbody id="ptbody"></tbody>
        </table>
      </div></div>
    </div>
    <div id="tab-audit" style="display:none">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:16px">Recent Activity</h2>
      <div id="alist"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mhd">
      <div class="mtitle" id="mtitle">Add Product</div>
      <button class="xbtn" onclick="closeModal()" aria-label="Close">×</button>
    </div>
    <div class="mbody">
      <input type="hidden" id="mid">
      <div class="mrow">
        <div class="mf"><label>Emoji</label><input type="text" id="memoji" placeholder="💐" maxlength="4"></div>
        <div class="mf"><label>Category</label><select id="mcat"><option value="bouquets">💐 Bouquets</option><option value="plants">🌿 Plants</option><option value="gifts">🎁 Gift Sets</option><option value="wedding">💍 Wedding</option></select></div>
      </div>
      <div class="mf"><label>Product Name *</label><input type="text" id="mname" placeholder="Desert Rose Bouquet" maxlength="200"></div>
      <div class="mf"><label>Subtitle</label><input type="text" id="msub" placeholder="12 stems · Same-day Dubai" maxlength="300"></div>
      <div class="mrow">
        <div class="mf"><label>Price</label><input type="text" id="mprice" placeholder="From AED 149" maxlength="100"></div>
        <div class="mf"><label>Badge Text</label><input type="text" id="mbadge" placeholder="Bestseller" maxlength="100"></div>
      </div>
      <div class="mf"><label>Badge Color</label><select id="mbs"><option value="forest">🟢 Green</option><option value="gold">🟡 Gold</option><option value="rose">🌸 Rose</option></select></div>
      <div class="mrow">
        <label class="mck"><input type="checkbox" id="mavail" checked><span>Visible on site</span></label>
        <label class="mck"><input type="checkbox" id="mfresh" checked><span>Mark as Fresh</span></label>
      </div>
    </div>
    <div class="mft">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="msave" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ─ Update API_URL after deploying the backend ──────
const API_URL = 'https://YOUR-BACKEND-URL.railway.app';

let products = [];

async function api(method, path, body) {
  const res = await fetch(API_URL + path, {
    method,
    credentials: 'include',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || 'HTTP ' + res.status);
  return json;
}

// ── LOGIN ────────────────────────────────────────────────────
document.getElementById('lp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('lbtn').addEventListener('click', doLogin);

async function doLogin() {
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  const err = document.getElementById('lerr');
  const btn = document.getElementById('lbtn');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const d = await api('POST', '/api/auth/login', { username: u, password: p });
    document.getElementById('tu').textContent = d.user.username;
    showApp();
  } catch (e) {
    err.textContent = e.message || 'Invalid credentials';
    err.classList.add('show');
    document.getElementById('lp').value = '';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function doLogout() {
  try { await api('POST', '/api/auth/logout'); } catch (_) {}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
  try {
    const me = await api('GET', '/api/auth/me');
    document.getElementById('tu').textContent = me.username;
    showApp();
  } catch (_) {
    document.getElementById('login-screen').style.display = 'flex';
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadProducts();
}

// ── PRODUCTS ─────────────────────────────────────────────────
async function loadProducts() {
  try {
    products = await api('GET', '/api/products?all=1');
    renderTable(); updateStats();
  } catch (e) { toast('Failed to load: ' + e.message, 'error'); }
}

function renderTable() {
  const tb = document.getElementById('ptbody');
  if (!products.length) {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#9CA3AF;padding:40px">No products yet. Click "+ Add Product"</td></tr>';
    return;
  }
  const bsc = { forest:'bf', gold:'bg', rose:'br' };
  tb.innerHTML = products.map(p => `<tr>
    <td class="ecol">${p.emoji||'💐'}</td>
    <td><div class="pname">${esc(p.name)}</div>${p.sub?`<div class="psub">${esc(p.sub)}</div>`:''}</td>
    <td><span class="cat">${catLbl(p.category)}</span></td>
    <td>${p.price?esc(p.price):'—'}</td>
    <td>${p.badge?`<span class="bp ${bsc[p.badge_style]||'bf'}">${esc(p.badge)}</span>`:'—'}</td>
    <td><label class="toggle"><input type="checkbox" ${p.fresh?'checked':''} onchange="tog('${p.id}','fresh',this.checked)"><span class="slider"></span></label></td>
    <td><label class="toggle"><input type="checkbox" ${p.available?'checked':''} onchange="tog('${p.id}','available',this.checked)"><span class="slider"></span></label></td>
    <td style="white-space:nowrap">
      <button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')">Edit</button>
      <button class="btn btn-danger btn-sm" style="margin-top:4px" onclick="delProduct('${p.id}')">Del</button>
    </td>
  </tr>`).join('');
}

function updateStats() {
  document.getElementById('s0').textContent = products.length;
  document.getElementById('s1').textContent = products.filter(p=>p.fresh&&p.available).length;
  document.getElementById('s2').textContent = products.filter(p=>!p.available).length;
  document.getElementById('s3').textContent = new Set(products.filter(p=>p.available).map(p=>p.category)).size;
}

async function tog(id, field, val) {
  try {
    const u = await api('PATCH', '/api/products/'+id, {[field]:val});
    const i = products.findIndex(p=>p.id===id);
    if (i>=0) products[i]=u;
    updateStats();
    toast('Updated ✓', 'success');
  } catch (e) { toast(e.message,'error'); loadProducts(); }
}

async function delProduct(id) {
  const p = products.find(x=>x.id===id);
  if (!confirm(`Delete "${p?.name||'this product'}"? Cannot be undone.`)) return;
  try {
    await api('DELETE', '/api/products/'+id);
    products = products.filter(x=>x.id!==id);
    renderTable(); updateStats();
    toast('Deleted', 'success');
  } catch (e) { toast(e.message,'error'); }
}

async function markAllFresh() {
  if (!confirm('Mark all products Fresh & Available?')) return;
  try {
    await api('POST', '/api/products/mark-all-fresh');
    await loadProducts();
    toast('All marked Fresh ✅', 'success');
  } catch (e) { toast(e.message,'error'); }
}

function exportJSON() {
  const b = new Blob([JSON.stringify(products,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'nasmat-products-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

// ── MODAL ────────────────────────────────────────────────────
function openModal(p) {
  document.getElementById('mtitle').textContent = p ? 'Edit Product' : 'Add Product';
  document.getElementById('msave').textContent  = p ? 'Save Changes' : 'Save Product';
  document.getElementById('mid').value    = p?.id        || '';
  document.getElementById('memoji').value = p?.emoji     || '💐';
  document.getElementById('mcat').value   = p?.category  || 'bouquets';
  document.getElementById('mname').value  = p?.name      || '';
  document.getElementById('msub').value   = p?.sub       || '';
  document.getElementById('mprice').value = p?.price     || '';
  document.getElementById('mbadge').value = p?.badge     || '';
  document.getElementById('mbs').value    = p?.badge_style|| 'forest';
  document.getElementById('mavail').checked = p ? p.available : true;
  document.getElementById('mfresh').checked = p ? p.fresh     : true;
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('mname').focus(),120);
}
function editProduct(id) { const p=products.find(x=>x.id===id); if(p) openModal(p); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });

async function saveProduct() {
  const id = document.getElementById('mid').value;
  const data = {
    emoji:       document.getElementById('memoji').value.trim()||'💐',
    name:        document.getElementById('mname').value.trim(),
    sub:         document.getElementById('msub').value.trim(),
    category:    document.getElementById('mcat').value,
    price:       document.getElementById('mprice').value.trim(),
    badge:       document.getElementById('mbadge').value.trim(),
    badge_style: document.getElementById('mbs').value,
    available:   document.getElementById('mavail').checked,
    fresh:       document.getElementById('mfresh').checked
  };
  if (!data.name) { toast('Name is required','error'); return; }
  const btn = document.getElementById('msave');
  btn.disabled=true; btn.textContent='Saving…';
  try {
    if (id) {
      const u = await api('PATCH','/api/products/'+id,data);
      const i = products.findIndex(p=>p.id===id);
      if(i>=0) products[i]=u;
    } else {
      products.push(await api('POST','/api/products',data));
    }
    renderTable(); updateStats(); closeModal();
    toast(id?'Updated ✅':'Added ✅','success');
  } catch (e) { toast(e.message,'error'); }
  finally { btn.disabled=false; btn.textContent=id?'Save Changes':'Save Product'; }
}

// ── AUDIT ────────────────────────────────────────────────────
async function loadAudit() {
  const el = document.getElementById('alist');
  el.innerHTML = '<div style="color:#9CA3AF;padding:12px">Loading…</div>';
  try {
    const evts = await api('GET','/api/audit?limit=50');
    if (!evts.length) { el.innerHTML='<div style="color:#9CA3AF;padding:12px">No activity logged yet.</div>'; return; }
    el.innerHTML = evts.map(e=>{
      const when = new Date(e.created_at).toLocaleString('en-AE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      const det  = e.details ? ' · '+JSON.stringify(e.details) : '';
      return `<div class="arow"><span class="atime">${when}</span><span class="aact">${e.action}</span><span class="adet">${e.username||'—'}${det}</span></div>`;
    }).join('');
  } catch (e) { el.innerHTML=`<div style="color:#DC2626">Error: ${esc(e.message)}</div>`; }
}

function switchTab(name,btn) {
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-products').style.display = name==='products'?'':'none';
  document.getElementById('tab-audit').style.display    = name==='audit'?'':'none';
  if (name==='audit') loadAudit();
}

// ── TOAST ────────────────────────────────────────────────────
let _tt;
function toast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast '+type+' show';
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),3000);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function catLbl(c){return{bouquets:'💐 Bouquets',plants:'🌿 Plants',gifts:'🎁 Gifts',wedding:'💍 Wedding'}[c]||c;}

window.addEventListener('DOMContentLoaded', checkSession);
</script>
</body>
</html>
